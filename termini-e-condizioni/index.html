<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termini e condizioni | Sardinia Discovery Travels</title>
<link rel="icon" href="../partner-form/img/sardinia-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--background:#1f1d1c;--cream:#f8f4ee;--muted:#b9b1a7;--teal:#2f7f88;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--cream);font-family:Montserrat,system-ui,sans-serif;font-size:17px;line-height:1.5}
a{color:inherit}
.wrap{width:min(880px,calc(100% - 32px));margin:0 auto;padding:32px 0 80px}
.logo{display:inline-flex}
.logo img{height:72px;width:auto}
h1{margin:28px 0 8px;font-size:clamp(36px,5vw,56px);font-weight:500;letter-spacing:-.02em;line-height:1.05}
.lead{margin:0 0 40px;color:var(--muted);font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:22px}
section{scroll-margin-top:24px;padding:28px 0;border-top:1px solid var(--line)}
h2{margin:0 0 16px;font-size:28px;font-weight:500}
.ph{margin:0;padding:20px 24px;border-radius:20px;border:1.5px dashed rgba(248,244,238,.28);color:var(--muted);font-style:italic}
section:target h2{color:#8fd0d4}
section:target .ph{border-color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="../"><img src="../partner-form/img/sardinia-logo.png" alt="Sardinia Discovery Travels" width="284" height="234"></a>
  <h1>Termini e condizioni</h1>
  <p class="lead">Sardinia Discovery Travels</p>
  <section id="pagamento">
    <h2>Pagamento</h2>
    <p class="ph">testo da inserire</p>
  </section>
  <section id="cancellazione">
    <h2>Cancellazione</h2>
    <p class="ph">testo da inserire</p>
  </section>
  <section id="altre-condizioni">
    <h2>Altre condizioni</h2>
    <p class="ph">testo da inserire</p>
  </section>
</div>
</body>
</html>
