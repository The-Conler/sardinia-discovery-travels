   Nothing else in the code depends on this file; its CSS is injected
   from here too.

   Click: fills ONLY the current screen with clearly fake data (no real
   people or businesses: "Mario Rossi Test", @example.com, +39 333 000 0000,
   a checksum-valid but invented P.IVA) and goes through the normal state
   path (S + save + render), so validation, Next and autosave behave as
   with real input. Choices already made on a screen are kept; empty
   choices get the first valid option.
   Shift+click (or long-press on touch): fill, then press Next.
   Optional URL presets for testers, e.g.
     ?devfill=paths:B,struct:st_ristorante   ?devfill=paths:A+B,sector:mare,form:associazione
   ===================================================================== */
const DEV_FILL = true;

if(DEV_FILL) (function(){
  const PRE = Object.fromEntries((new URLSearchParams(location.search).get('devfill')||'')
    .split(',').filter(Boolean).map(x=>x.split(':')));
  const L = (it, en) => S.lang==='it' ? it : en;
  const FAKE_VAT = '12345678903';                 /* invented, passes the 11-digit check and the P.IVA checksum */
  const EXP_TXT = {
    artigianato:   ['Laboratorio di tessitura (test)', 'Weaving workshop (test)', 'Aggius'],
    enogastronomia:['Degustazione in cantina (test)', 'Winery tasting (test)', 'Tempio Pausania'],
    cultura:       ['Visita guidata al nuraghe (test)', 'Guided nuraghe visit (test)', 'Barumini'],
    natura:        ['Escursione sul Limbara (test)', 'Limbara hike (test)', 'Tempio Pausania'],
    mare:          ['Giro in barca alla Maddalena (test)', 'La Maddalena boat trip (test)', 'Palau'],
    guide:         ['Passeggiata guidata nel centro storico (test)', 'Guided old town walk (test)', 'Alghero'],
    trasporti:     ['Transfer aeroporto e hotel (test)', 'Airport to hotel transfer (test)', 'Olbia']
  };
  const NUM = { distance_km:'8', elevation_m:'350', boat_length:'9.5' };
  const TXT = { port:['Porto turistico di prova','Test marina'], license_no:['TEST-0000','TEST-0000'], areas:['Gallura e Nord Sardegna','Gallura and North Sardinia'] };
  const STEP = { boat_capacity:10, seats:8, fleet:2 };

  function fillExp(k, i){
    const e = S.exps[i]; if(!e) return;
    const txt = () => EXP_TXT[e.sector] || EXP_TXT.artigianato;
    switch(k){
      case 'sector': { const prev = e.sector; e.sector = e.sector || PRE.sector || 'artigianato'; afterPick(`exps.${i}.sector`, prev); break; }
      case 'spec': { const sp = SECTOR[e.sector].spec || []; if(sp.length && !specList(e).length) e.spec = sp.find(x=>!CONFIG.otherSpec.includes(x)) || sp[0];
        if(specList(e).some(x=>CONFIG.otherSpec.includes(x)) && !filled(e.specOther,3)) e.specOther = L('Specialità di prova','Test specialty'); break; }
      case 'type': if(!isHike(e) && allowedTypes(e).length && !typeList(e).length) e.type = [allowedTypes(e)[0]]; break;
      case 'g1': e.name = L(txt()[0], txt()[1]);
        e.desc = L('Esperienza di prova creata con il riempimento automatico: gli ospiti incontrano il partner, seguono una breve introduzione e partecipano all\'attività in un piccolo gruppo.',
                   'Test experience created by the auto fill: guests meet the partner, follow a short introduction and take part in the activity in a small group.'); break;
      case 'g2': e.comune = txt()[2];
        if(e.sector === 'mare'){ e.localita = L('Centro','Town centre'); e.meet = L('Piazza principale, punto di incontro di prova','Main square, test meeting point'); }
        else { if(!filled(e.address,3)) e.address = L('Via Roma 12','12 Via Roma'); e.localita = ''; e.meet = ''; e.end = ''; }
        break;
      case 'g3': e.durH = e.sector==='mare' ? 4 : 2; e.durM = 0; e.min = 2; e.max = 8; e.minAge = 6; break;
      case 'g4': if(!e.langs.length) e.langs = ['it','en']; if(!e.access.length) e.access = ['acc_families']; break;
      case 'mode': if(!e.mode) e.mode = CONFIG.modes[0][0]; break;
      case 'incl': if(!Object.keys(e.incl).length){
        const extra = e.sector === 'enogastronomia'
          ? (typeList(e).includes('degustazione') ? {} : {inc_tasting:'inc'})
          : e.sector === 'cultura'
            ? {}
            : {inc_materials:'inc', ...({mare:{inc_drinks:'inc', inc_equipment:'inc'}, natura:{inc_equipment:'inc'}}[e.sector]||{})};
        e.incl = {inc_guide:'inc', ...extra};
        normalizeIncl(e);
      } break;
      case 'equip': e.equipProvided = true; e.bringNote=''; break;
      case 'reqs': if(e.sector==='artigianato'){ if(!e.comune) e.comune = txt()[2]; if(!filled(e.address,3)) e.address = L('Via Roma 12','12 Via Roma'); } if(isHike(e)){ const h = ensureHike(e); if(!h.ways) h.ways = 'one'; const key = hikeInlineKey(e); if(key){ const p = h.profiles[key]; if(!p.cai) p.cai = 'e'; if(!pos(p.km)) p.km = '8'; if(!pos(p.elev)) p.elev = '420'; if(!filled(p.dur,1)) p.dur = '3 h'; if(!pos(p.alt)) p.alt = '900'; if(!h.car) h.car = 'no'; } } else if(showsDifficulty(e)){ if(!e.difficulty) e.difficulty = CONFIG.difficulty[0]; } else e.difficulty = ''; break;
      case 'sq': sectorQs(e).forEach(q=>{
        const v = e.sq[q.k];
        if(q.t==='toggle'){ if(v===undefined) e.sq[q.k] = q.def ?? true; }
        else if(q.t==='pills'){ if(!v) e.sq[q.k] = q.o[0]; }
        else if(q.t==='multi'){ if(!(v||[]).length) e.sq[q.k] = [q.o[0]]; }
        else if(q.t==='num'){ if(!pos(v)) e.sq[q.k] = NUM[q.k] || '1'; }
        else if(q.t==='stepper'){ if(!pos(v)) e.sq[q.k] = Math.min(q.max, STEP[q.k] || 1); }
        else if(!filled(v)){ const x = TXT[q.k] || ['Testo di prova','Test text']; e.sq[q.k] = L(x[0], x[1]); }
      }); break;
      case 'avail': if(!e.period) e.period = 'op_season'; if(!e.months.length) e.months = e.period==='op_year' ? [...Array(12).keys()] : [3,4,5,6,7,8,9];
        if(!e.days.length) e.days = ['d1','d2','d3','d4','d5','d6']; break;
      case 'slots': if(!e.bands.length) e.bands = ['band_morning']; if(!e.slots.length) e.slots = ['10:00'];
        if(!e.notice) e.notice = 'n48'; break;
      case 'price': if(!e.priceMode) e.priceMode = CONFIG.priceModes[0];
        blocks(e).forEach(b=>{ const p = e.price[b]; if(!pos(p.base)) p.base = b==='priv' ? '120' : '60'; if(!(p.incl>=1)) p.incl = 1; }); break;
      case 'cond': e.termsAccepted = true; if(!e.termsAcceptedAt) e.termsAcceptedAt = new Date().toISOString(); if(!e.billing || e.billing==='bill_receipt') e.billing = 'bill_einv'; break;
      case 'photos': { let n = 0; const si = SECTOR[e.sector]?.img; if(si && !e.photos.length) e.photos.push({src:si, name:si.split('/').pop(), sample:true}); while(e.photos.length < 3){ const src = SAMPLE_PHOTOS[(e.photos.length+i+n) % SAMPLE_PHOTOS.length]; e.photos.push({src, name:src.split('/').pop(), sample:true}); n++; } break; }
    }
  }

  function fillConv(id){
    const c = S.conv, g = () => cgroup();
    if(id==='conv_type'){ if(!c.type) c.type = PRE.struct || CONFIG.structures[0][0]; return; }
    if(id==='conv_details'){
      if(g()==='ricettivo'){ c.stars = c.stars || 's3'; if(!pos(c.units)) c.units = '12'; c.beds = c.beds || '30';
        if(!c.services.length) c.services = ['hs_breakfast','hs_wifi']; c.opening = c.opening || 'op_season'; c.groups = true; }
      else if(g()==='ristorazione' && isSeated()){ if(!c.cuisine.length) c.cuisine = ['cu_sarda'];
        if(!pos(c.seatsIn)) c.seatsIn = '40'; c.seatsOut = c.seatsOut || '20'; c.groupMax = c.groupMax || '30'; c.opening = c.opening || 'op_year'; }
      else if(g()==='ristorazione'){ if(!c.cuisine.length) c.cuisine = ['cu_sarda']; if(!pos(c.maxGuests)) c.maxGuests = '50'; c.area = c.area || 'Gallura'; }
      else { if(c.otherDesc.trim().length < 20) c.otherDesc = L('Struttura di prova per il test del modulo, nessun dato reale.','Test venue used to try the form, no real data.'); }
      return; }
    if(id==='conv_interest'){ if(!c.interests.length) c.interests = ['int_tariffe','int_gruppi']; return; }
    if(id==='conv_ops'){ if(!c.channels.length) c.channels = ['ch_email']; c.response = c.response || 'rt_day';
      if(!c.sameBooking && !(filled(c.bookName) && emailOk(c.bookEmail))){ c.bookName = 'Mario Rossi Test'; c.bookEmail = 'prenotazioni.test@example.com'; } }
  }

  function fillCurrent(){
    const id = S.pos, C = S.contact, G = S.org;
    const m = id.match(/^e(\d+)_(\w+)$/);
    const hm = id.match(/^e(\d+)_hk(\d+)$/);
    if(hm){ const e = S.exps[+hm[1]]; if(e){ const keys = hikeSeq(e), key = keys[+hm[2]]; if(key){ const p = ensureHike(e).profiles[key]; if(!p.cai) p.cai = 'e'; if(!pos(p.km)) p.km = '8'; if(!pos(p.elev)) p.elev = '420'; if(!filled(p.dur,1)) p.dur = '3 h'; if(!pos(p.alt)) p.alt = '900'; if(+hm[2] === keys.length-1 && !e.hike.car) e.hike.car = 'no'; } } }
    else if(m) fillExp(m[2], +m[1]);
    else if(/^conv_/.test(id)) fillConv(id);
    else switch(id){
      case 'ref_name': C.first = 'Mario'; C.last = 'Rossi Test'; break;
      case 'ref_role': C.role = C.role || CONFIG.roles[0][0]; break;
      case 'ref_contact': C.email = 'mario.rossi.test@example.com'; C.prefix = '+39'; C.phone = '333 000 0000'; break;
      case 'ref_lang': C.lang = C.lang || S.lang; break;
      case 'ref_auth': C.auth = true; break;
      case 'org_form': G.form = G.form || PRE.form || 'societa'; break;
      case 'org_extra': ({
        societa: () => { G.socForm = G.socForm || 'srl'; },
        lib_prof_iva: () => { G.profession = L('Guida ambientale (test)','Nature guide (test)'); },
        associazione: () => { G.assocType = G.assocType || 'aps'; G.legalRep = 'Mario Rossi Test'; },
        cooperativa: () => { G.coopType = G.coopType || 'coop_lavoro'; },
        ente_pubblico: () => { G.office = L('Ufficio Turismo (test)','Tourism office (test)'); G.opRef = 'Mario Rossi Test'; },
        altra_forma: () => { G.otherForm = L('Forma di prova','Test form'); }
      }[G.form] || (()=>{}))(); break;
      case 'org_ident': G.name = 'Partner Test ' + (G.form==='societa' ? 'S.r.l.' : 'Sardegna'); G.brand = 'Test Brand';
        G.vat = FAKE_VAT; G.cf = FAKE_VAT; break;           /* 11-digit CF is the valid form for organisations */
      case 'org_address': Object.assign(G, {addr:'Via di Prova 1', comune:'Tempio Pausania', prov:'SS', cap:'07029', region:'Sardegna', country:'Italia', sameOp:true}); break;
      case 'org_contacts': G.email = 'info.test@example.com'; G.phone = '+39 333 000 0000'; G.website = 'https://www.example.com'; break;
      case 'collab': if(!S.paths.length) S.paths = (PRE.paths || 'A').split(/[+ ]/).filter(x=>x==='A'||x==='B');
        if((S.paths.includes('A')||S.paths.includes('C')) && !S.exps.length) S.exps.push(newExp()); break;
      case 'review': S.consents.privacy = true; S.consents.evaluation = true; break;
    }
    save(); render();
  }

  /* ---------- Button, CSS and wiring ---------- */
  const FLASK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg>';
  const css = document.createElement('style');
  css.textContent = `.sd-glass.dev-fill{gap:10px;padding:0 22px;border:1.5px dashed rgba(47,127,136,.95);color:#8fd0d7;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s var(--ct-ease)}
.sd-glass.dev-fill:hover{background:rgba(47,127,136,.22)}
.sd-glass.dev-fill:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(47,127,136,.3)}
.sd-glass.dev-fill[hidden]{display:none}
@media (max-width:640px){.sd-glass.dev-fill{width:44px;flex:none;padding:0;justify-content:center}.sd-glass.dev-fill span{display:none}.sd-tools:has(.dev-fill:not([hidden])){gap:8px}.sd-tools:has(.dev-fill:not([hidden])) .sd-save{white-space:nowrap;padding:0 12px;font-size:15px}}
@media (max-width:380px){.sd-glass.dev-fill{width:40px}.sd-tools:has(.dev-fill:not([hidden])) .sd-save{padding:0 10px}.sd-tools:has(.dev-fill:not([hidden])){gap:6px}.sd-tools:has(.dev-fill:not([hidden])) .sd-lang button{min-width:38px;padding:0 7px}}`;
  document.head.appendChild(css);
  const btn = document.createElement('button');
  btn.type = 'button'; btn.id = 'devFill'; btn.className = 'sd-glass dev-fill';   /* same pill as the IT/EN toggle, dashed teal = temporary */
  document.querySelector('.sd-tools').prepend(btn);
  const label = () => { const x = L('Dati di test','Fill test data');
    btn.innerHTML = `${FLASK}<span>${x}</span>`; btn.setAttribute('aria-label', x);
    btn.title = L('Temporaneo, solo per i test. Maiusc+clic: compila e vai avanti.','Temporary, testing only. Shift+click: fill and go to Next.');
    btn.hidden = ['welcome','thanks'].includes(S.pos); };
  const fillAndNext = () => { fillCurrent(); if(cur().s.ok()) next(); };
  let lp = null, lpDone = false;
  btn.addEventListener('click', e => { if(lpDone){ lpDone = false; return; } e.shiftKey ? fillAndNext() : fillCurrent(); });
  btn.addEventListener('pointerdown', e => { if(e.pointerType!=='touch') return; lpDone = false;
    lp = setTimeout(()=>{ lpDone = true; fillAndNext(); }, 600); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, ()=>clearTimeout(lp)));
  btn.addEventListener('contextmenu', e => { if(lpDone) e.preventDefault(); });
  const baseRender = render;
  render = function(dir){ baseRender(dir); label(); };   /* keep label and visibility in sync with screen and language */
  label();
  window.devFill = { fill: fillCurrent, fillAndNext };     /* handy from the console */
})();
</script>
</body>
</html>
